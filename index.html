<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Triple Challenge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Triple Challenge">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── RESET ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    input  { font-family: inherit; }

    /* ── TOKENS ───────────────────────────────────────────── */
    :root {
      --bg:       #0a0a0a;
      --surface:  #141414;
      --surface2: #1c1c1c;
      --border:   #262626;
      --border2:  #333;
      --red:      #e53935;
      --red-dim:  rgba(229,57,53,0.12);
      --green:    #2e7d32;
      --green-b:  #43a047;
      --green-dim:rgba(67,160,71,0.12);
      --white:    #f5f5f5;
      --grey:     #666;
      --grey2:    #444;
      --head:     'Bebas Neue', sans-serif;
      --body:     'DM Sans', sans-serif;
      --mono:     'DM Mono', monospace;
      --r-sm:     10px;
      --r-md:     14px;
      --r-lg:     20px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    /* ── BASE ─────────────────────────────────────────────── */
    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      font-family: var(--body);
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── LOADING ──────────────────────────────────────────── */
    .loading-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--grey);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border2);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── USER SELECT ──────────────────────────────────────── */
    .user-select-screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px calc(40px + var(--safe-bot));
      background: var(--bg);
      overflow-y: auto;
    }

    .logo-block {
      text-align: center;
      margin-bottom: 48px;
    }

    .app-title {
      font-family: var(--head);
      font-size: 72px;
      line-height: 0.9;
      letter-spacing: 3px;
      color: var(--white);
    }

    .app-title span { color: var(--red); }

    .app-sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--grey);
      margin-top: 12px;
      text-transform: uppercase;
    }

    .user-cards {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    .user-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
      padding: 0;
    }

    .user-card:active {
      transform: scale(0.97);
      border-color: var(--red);
    }

    .photo-wrap {
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--surface2);
    }

    .user-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .user-name {
      font-family: var(--head);
      font-size: 24px;
      letter-spacing: 3px;
      padding: 14px 0 16px;
      color: var(--white);
    }

    /* ── MAIN SCREEN ──────────────────────────────────────── */
    .main-screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + var(--safe-top)) 16px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .back-btn {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--grey);
      font-size: 13px;
      transition: color 0.15s, border-color 0.15s;
    }
    .back-btn:active { color: var(--white); border-color: var(--red); }

    .header-title { display: flex; flex-direction: column; gap: 1px; }

    .header-user {
      font-family: var(--head);
      font-size: 22px;
      letter-spacing: 1.5px;
      line-height: 1;
      color: var(--white);
    }

    .header-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
    }

    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--grey);
      transition: color 0.15s, border-color 0.15s;
    }
    .icon-btn:active { color: var(--white); border-color: var(--red); }

    /* ── SCROLL AREA ──────────────────────────────────────── */
    .main-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(40px + var(--safe-bot));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── DAY HEADER CARD ──────────────────────────────────── */
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px 24px;
    }

    .day-badge { display: flex; flex-direction: column; gap: 2px; }

    .day-num {
      font-family: var(--head);
      font-size: 52px;
      line-height: 1;
      color: var(--white);
    }

    .month-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
    }

    .day-progress-ring {
      position: relative;
      width: 60px; height: 60px;
      flex-shrink: 0;
    }

    .day-progress-ring svg { width: 100%; height: 100%; }

    .ring-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--white);
    }

    /* ── BANNERS ──────────────────────────────────────────── */
    .all-done-banner {
      background: var(--green-dim);
      border: 1px solid rgba(67,160,71,0.3);
      border-radius: var(--r-md);
      padding: 14px 18px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--green-b);
      text-align: center;
      text-transform: uppercase;
    }

    /* ── SECTION BLOCKS (WARM UP / COOL DOWN) ─────────────── */
    .routine-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
    }

    .routine-section.routine-done {
      border-color: rgba(67,160,71,0.35);
    }

    .routine-section.routine-locked {
      opacity: 0.55;
    }

    .routine-section.routine-locked .stretch-log-btn {
      pointer-events: none;
      opacity: 0.3;
    }

    .routine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .routine-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .routine-icon { display: flex; color: var(--red); }

    .routine-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
    }

    .routine-log-btn {
      background: var(--green-b);
      color: var(--white);
      font-family: var(--head);
      font-size: 15px;
      letter-spacing: 1.5px;
      padding: 8px 20px;
      border-radius: var(--r-sm);
      transition: opacity 0.15s, transform 0.1s;
    }
    .routine-log-btn:active { opacity: 0.8; transform: scale(0.96); }

    .routine-tick {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: var(--green-dim);
      color: var(--green-b);
      border-radius: 50%;
    }

    .routine-locked-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--grey);
      text-transform: uppercase;
    }

    .routine-items {
      padding: 8px 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .routine-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .routine-item:last-child { border-bottom: none; }
    .routine-item.routine-item-done { opacity: 0.5; }

    .routine-item-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .routine-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      flex: 1;
    }

    .routine-item-duration {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--red);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .routine-item-desc {
      font-size: 12px;
      color: var(--grey);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .stretch-log-row {
      display: flex;
      justify-content: flex-end;
    }

    .stretch-log-btn {
      background: transparent;
      border: 1px solid var(--green-b);
      color: var(--green-b);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 5px 14px;
      border-radius: 6px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .stretch-log-btn:active { background: var(--green-dim); }

    .stretch-done-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--green-b);
    }

    .stretch-locked { display: none; }

    /* ── EXERCISES LIST ───────────────────────────────────── */
    .exercises-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px;
      transition: border-color 0.2s;
    }

    .exercise-card.done { border-color: rgba(67,160,71,0.35); }
    .exercise-card.rest { opacity: 0.4; }

    .ex-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ex-icon {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2);
      border-radius: var(--r-sm);
      color: var(--grey);
      flex-shrink: 0;
    }

    .exercise-card.done .ex-icon { color: var(--green-b); background: var(--green-dim); }

    .ex-info { flex: 1; min-width: 0; }

    .ex-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .ex-target {
      font-size: 15px;
      color: var(--grey);
      font-weight: 400;
    }

    .ex-target strong {
      color: var(--white);
      font-size: 20px;
      font-weight: 600;
      display: block;
      line-height: 1.1;
    }

    .rest-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--grey);
      text-transform: uppercase;
    }

    .ex-action { flex-shrink: 0; }

    .log-btn {
      background: var(--red);
      color: var(--white);
      font-family: var(--head);
      font-size: 17px;
      letter-spacing: 1.5px;
      padding: 10px 22px;
      border-radius: var(--r-sm);
      transition: opacity 0.15s, transform 0.1s;
    }
    .log-btn:active { opacity: 0.85; transform: scale(0.96); }

    .done-tick {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--green-dim);
      color: var(--green-b);
      border-radius: 50%;
    }

    /* ── LOGGED TAGS ──────────────────────────────────────── */
    .ex-logged-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .logged-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--grey);
    }

    .effort-easy    { color: var(--green-b); border-color: rgba(67,160,71,0.3); }
    .effort-neutral { color: #f9a825; border-color: rgba(249,168,37,0.3); }
    .effort-hard    { color: var(--red); border-color: rgba(229,57,53,0.3); }
    .breakdown-tag  { color: var(--white); border-color: var(--border2); }

    /* ── FORM GUIDE ───────────────────────────────────────── */
    .form-guide {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .form-guide-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--grey);
      text-transform: uppercase;
      width: 100%;
      padding: 0;
      transition: color 0.15s;
    }
    .form-guide-toggle:active { color: var(--white); }

    .fg-chevron {
      margin-left: auto;
      display: flex;
      transition: transform 0.2s;
      color: var(--grey2);
    }

    .form-guide-body {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .fg-section-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .fg-cue {
      font-size: 13px;
      color: var(--white);
      line-height: 1.5;
      padding: 8px 12px;
      border-left: 2px solid var(--red);
      background: var(--surface2);
      border-radius: 0 6px 6px 0;
      margin-bottom: 6px;
    }

    .fg-step {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: var(--grey);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .fg-step-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--red);
      flex-shrink: 0;
      width: 16px;
      padding-top: 2px;
    }

    /* ── PARTNER STRIP ────────────────────────────────────── */
    .partner-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px 18px;
    }

    .partner-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .partner-info {
      font-size: 13px;
      color: var(--grey);
      flex: 1;
    }

    /* ── MODALS ───────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 28px 24px calc(28px + var(--safe-bot));
      width: 100%;
      max-width: 480px;
      animation: slide-up 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-title {
      font-family: var(--head);
      font-size: 32px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 24px;
      color: var(--white);
    }

    .pick-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pick-grid.three { grid-template-columns: repeat(3, 1fr); }
    .pick-grid.two   { grid-template-columns: repeat(2, 1fr); }

    .pick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 22px 8px 18px;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }
    .pick-btn:active {
      transform: scale(0.93);
      border-color: var(--red);
      background: var(--red-dim);
    }

    .pick-icon { display: flex; align-items: center; justify-content: center; color: var(--white); }

    .pick-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--grey);
      text-align: center;
      text-transform: uppercase;
    }

    .cancel-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--grey);
      text-transform: uppercase;
    }

    /* ── BREAKDOWN MODAL ──────────────────────────────────── */
    .breakdown-hint {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--grey);
      text-align: center;
      margin-bottom: 16px;
    }

    .breakdown-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      justify-content: center;
    }

    .preset-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--grey);
      transition: border-color 0.15s, color 0.15s;
    }
    .preset-btn:active { border-color: var(--red); color: var(--white); }

    .breakdown-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      padding: 14px 16px;
      color: var(--white);
      font-size: 24px;
      font-family: var(--mono);
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .breakdown-input:focus { border-color: var(--red); }
    .breakdown-input::placeholder { color: var(--border2); font-size: 14px; }

    .breakdown-save-btn {
      width: 100%;
      margin-bottom: 10px;
    }

    /* ── PROGRESS ─────────────────────────────────────────── */
    .prog-tabs {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .prog-tab {
      flex: 1;
      padding: 10px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--grey);
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .prog-tab.active {
      background: var(--red-dim);
      border-color: rgba(229,57,53,0.4);
      color: var(--white);
    }

    .prog-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--grey);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .prog-day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .prog-day-card.prog-today { border-color: rgba(229,57,53,0.45); }
    .prog-day-card.prog-past { opacity: 0.65; }

    .prog-day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .prog-day-num {
      font-family: var(--head);
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--white);
    }

    .prog-today .prog-day-num { color: var(--red); }

    .prog-day-date {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--grey);
    }

    .prog-ex-rows { padding: 6px 16px 10px; }

    .prog-ex-header {
      display: grid;
      grid-template-columns: 1fr 64px 64px;
      padding: 6px 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }

    .prog-user-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-align: center;
      text-transform: uppercase;
    }

    .prog-ex-row {
      display: grid;
      grid-template-columns: 1fr 64px 64px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .prog-ex-row:last-child { border-bottom: none; }
    .prog-ex-row.rest { opacity: 0.35; }

    .prog-ex-name {
      font-size: 12px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .prog-target {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--grey);
      display: block;
    }

    .prog-rest-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.05em;
      color: var(--grey2);
      text-align: center;
      text-transform: uppercase;
    }

    .prog-done-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--green-b);
    }

    .prog-empty-cell {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--border2);
      text-align: center;
    }

    /* ── STATS ────────────────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 20px;
      text-align: center;
    }

    .stat-name {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-num {
      font-family: var(--head);
      font-size: 48px;
      line-height: 1;
      color: var(--white);
    }

    .stat-of { font-size: 24px; color: var(--grey); }

    .stat-label {
      font-size: 11px;
      color: var(--grey);
      margin: 6px 0 14px;
    }

    .stat-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .stat-fill {
      height: 100%;
      background: var(--red);
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .stat-pct {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--grey);
    }

    /* ── SETTINGS ─────────────────────────────────────────── */
    .settings-content { gap: 24px !important; }

    .settings-section {}

    .settings-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--white);
    }

    .setting-row:last-of-type { border-bottom: none; }

    .setting-hint {
      padding: 8px 20px 14px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--grey);
    }

    .toggle { position: relative; display: inline-block; width: 46px; height: 26px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border2);
      border-radius: 26px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 20px; width: 20px;
      left: 3px; bottom: 3px;
      background: var(--white);
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--red); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    .time-input {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      padding: 6px 10px;
      color: var(--white);
      font-size: 14px;
    }

    .install-text {
      padding: 16px 20px 8px;
      font-size: 13px;
      color: var(--grey);
      line-height: 1.6;
    }

    .install-steps { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 8px; }

    .install-platform { font-size: 13px; color: var(--grey); }
    .install-platform strong { color: var(--white); }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--white);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span:last-child { color: var(--grey); font-family: var(--mono); font-size: 12px; }

    .switch-btn {
      width: 100%;
      padding: 18px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--r-lg);
      font-family: var(--head);
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--grey);
      transition: color 0.15s, border-color 0.15s;
    }
    .switch-btn:active { color: var(--white); border-color: var(--red); }

    /* ── BACKFILL ─────────────────────────────────────────── */
    .backfill-list { display: flex; flex-direction: column; gap: 10px; }

    .backfill-day-btn {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 2px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px 20px;
      text-align: left;
      transition: border-color 0.15s;
    }
    .backfill-day-btn:active { border-color: var(--red); }

    .backfill-day-label {
      font-family: var(--head);
      font-size: 20px;
      letter-spacing: 1px;
      color: var(--white);
      grid-column: 1; grid-row: 1;
    }

    .backfill-day-date {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--grey);
      grid-column: 1; grid-row: 2;
    }

    .backfill-day-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--grey);
      grid-column: 2; grid-row: 1 / 3;
      display: flex;
      align-items: center;
    }

    .backfill-user-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .backfill-user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .backfill-user-name {
      font-family: var(--head);
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--white);
    }

    .backfill-mini-status { display: flex; gap: 10px; color: var(--green-b); }

    .backfill-ex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .backfill-ex-row:last-of-type { border-bottom: none; }
    .backfill-ex-row.rest { opacity: 0.35; }
    .backfill-ex-row.done { background: rgba(67,160,71,0.03); }

    .backfill-ex-label {
      font-size: 14px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .backfill-done-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green-b);
    }

    .backfill-log-btn { padding: 8px 16px; font-size: 14px; }

    .backfill-extras {
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      flex-wrap: wrap;
    }

    .backfill-extra-btn {
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--r-sm);
      padding: 7px 14px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--grey);
      transition: border-color 0.15s, color 0.15s;
      text-transform: uppercase;
    }
    .backfill-extra-btn:active { border-color: var(--green-b); color: var(--green-b); }

    .backfill-extra-done {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--green-b);
    }

    /* ── COMPLETE BANNER ──────────────────────────────────── */
    .complete-banner {
      background: var(--surface);
      border: 1px solid rgba(229,57,53,0.3);
      border-radius: var(--r-lg);
      padding: 32px 24px;
      font-family: var(--head);
      font-size: 32px;
      letter-spacing: 1px;
      text-align: center;
      color: var(--white);
    }

  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./content/challengeData.js"></script>
  <script src="./config.js"></script>
  <script src="./js/scripts.js"></script>
</body>
</html>
