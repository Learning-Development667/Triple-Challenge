<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Triple Challenge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Triple Challenge">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       RESET & BASE
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a1a;
      --surface: #111;
      --surface2: #0f0f0f;
      --red: #c0392b;
      --red-dark: #a93226;
      --green: #27ae60;
      --white: #ffffff;
      --dim: #888;
      --border: #2a2a2a;
      --border2: #333;
      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    #app {
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
    }

    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    input { font-family: inherit; }

    /* =====================================================
       LOADING
    ===================================================== */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border2);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* =====================================================
       USER SELECT SCREEN
    ===================================================== */
    .user-select-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px 24px;
      gap: 48px;
      background: var(--surface2);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(192,57,43,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(192,57,43,0.05) 0%, transparent 60%);
    }

    .logo-block {
      text-align: center;
    }

    .app-title {
      font-family: var(--font-head);
      font-size: 56px;
      line-height: 0.95;
      letter-spacing: 2px;
      color: var(--white);
    }

    .app-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--red);
      margin-top: 10px;
      text-transform: uppercase;
    }

    .user-cards {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }

    .user-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      padding: 0;
    }

    .user-card:active {
      transform: scale(0.97);
      border-color: var(--red);
      box-shadow: 0 0 24px rgba(192,57,43,0.3);
    }

    .photo-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #0a0a0a;
    }

    .user-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .user-name {
      font-family: var(--font-head);
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--white);
      padding: 12px 0 14px;
    }

    /* =====================================================
       MAIN SCREEN LAYOUT
    ===================================================== */
    .main-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: calc(12px + var(--safe-top));
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      font-size: 14px;
      color: var(--dim);
      transition: color 0.15s, border-color 0.15s;
    }

    .back-btn:active { color: var(--white); border-color: var(--red); }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-user {
      font-family: var(--font-head);
      font-size: 20px;
      letter-spacing: 1px;
      line-height: 1;
    }

    .header-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--red);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      font-size: 16px;
    }

    .main-content {
      flex: 1;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 16px;
      padding-bottom: calc(32px + var(--safe-bot));
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    /* =====================================================
       DAY HEADER
    ===================================================== */
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .day-badge {
      display: flex;
      flex-direction: column;
    }

    .day-num {
      font-family: var(--font-head);
      font-size: 40px;
      line-height: 1;
      color: var(--white);
    }

    .month-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .day-progress-ring {
      position: relative;
      width: 52px; height: 52px;
      flex-shrink: 0;
    }

    .day-progress-ring svg {
      width: 100%; height: 100%;
    }

    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--white);
    }

    /* =====================================================
       EXERCISE CARDS
    ===================================================== */
    .exercises-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .exercise-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: border-color 0.2s;
    }

    .exercise-card.done {
      border-color: rgba(39,174,96,0.4);
      background: rgba(39,174,96,0.04);
    }

    .exercise-card.rest {
      opacity: 0.5;
    }

    .ex-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .ex-info {
      flex: 1;
      min-width: 0;
    }

    .ex-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .ex-target {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--dim);
    }

    .ex-target strong {
      color: var(--white);
      font-weight: 600;
    }

    .ex-mood {
      font-size: 12px;
      color: var(--green);
      margin-top: 3px;
    }

    .rest-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--dim);
    }

    .rest-badge {
      font-size: 20px;
    }

    .ex-action { flex-shrink: 0; }

    .log-btn {
      background: var(--red);
      color: var(--white);
      font-family: var(--font-head);
      font-size: 15px;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    .log-btn:active {
      background: var(--red-dark);
      transform: scale(0.96);
    }

    .done-tick {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(39,174,96,0.15);
      color: var(--green);
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
    }

    /* =====================================================
       BANNERS
    ===================================================== */
    .all-done-banner {
      background: rgba(39,174,96,0.1);
      border: 1px solid rgba(39,174,96,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--green);
      text-align: center;
    }

    .complete-banner {
      background: var(--surface);
      border: 1px solid rgba(192,57,43,0.4);
      border-radius: 14px;
      padding: 24px;
      font-family: var(--font-head);
      font-size: 28px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* =====================================================
       PARTNER STRIP
    ===================================================== */
    .partner-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .partner-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .partner-info {
      font-size: 13px;
      color: var(--dim);
      flex: 1;
    }

    /* =====================================================
       LOGGED TAGS
    ===================================================== */
    .ex-logged-row {
      display: flex;
      gap: 6px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .logged-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 3px 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--dim);
    }

    .logged-tag svg { flex-shrink: 0; }

    .effort-easy    { color: var(--green); border-color: rgba(39,174,96,0.3); }
    .effort-neutral { color: #f0a500; border-color: rgba(240,165,0,0.3); }
    .effort-hard    { color: var(--red); border-color: rgba(192,57,43,0.3); }

    /* =====================================================
       PICKER MODALS (EFFORT + SETS)
    ===================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px;
      padding-bottom: calc(28px + var(--safe-bot));
      width: 100%;
      max-width: 480px;
      animation: slide-up 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-title {
      font-family: var(--font-head);
      font-size: 28px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 24px;
    }

    .pick-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pick-grid.three { grid-template-columns: repeat(3, 1fr); }
    .pick-grid.two   { grid-template-columns: repeat(2, 1fr); }

    .pick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 8px 16px;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }

    .pick-btn:active {
      transform: scale(0.93);
      border-color: var(--red);
      background: rgba(192,57,43,0.08);
    }

    .pick-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }

    .pick-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-align: center;
      text-transform: uppercase;
    }

    .cancel-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--dim);
    }

    /* =====================================================
       PROGRESS VIEW
    ===================================================== */
    .prog-tabs {
      display: flex;
      gap: 8px;
    }

    .prog-tab {
      flex: 1;
      padding: 10px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .prog-tab.active {
      background: rgba(192,57,43,0.12);
      border-color: rgba(192,57,43,0.5);
      color: var(--white);
    }

    .prog-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .prog-table-wrap { }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .prog-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 380px;
    }

    .prog-table th {
      background: var(--surface2);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--red);
      text-transform: uppercase;
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .prog-table th:first-child { text-align: left; padding-left: 12px; }

    .sub-header th {
      color: var(--dim) !important;
      font-size: 8px !important;
      padding: 4px 6px !important;
    }

    .prog-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .prog-table tr:last-child td { border-bottom: none; }

    .day-cell {
      text-align: left !important;
      padding-left: 12px !important;
      color: var(--white) !important;
      font-weight: 500;
    }

    .target-cell { color: var(--white) !important; }
    .done-cell { color: var(--green) !important; }
    .rest-cell { color: var(--border2) !important; }

    .today-row td { background: rgba(192,57,43,0.06); }
    .today-row .day-cell { color: var(--red) !important; }
    .past-row { opacity: 0.6; }

    /* =====================================================
       STATS
    ===================================================== */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-name {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      margin-bottom: 8px;
    }

    .stat-num {
      font-family: var(--font-head);
      font-size: 40px;
      line-height: 1;
    }

    .stat-of { font-size: 20px; color: var(--dim); }

    .stat-label {
      font-size: 11px;
      color: var(--dim);
      margin: 4px 0 12px;
    }

    .stat-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .stat-fill {
      height: 100%;
      background: var(--red);
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .stat-pct {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
    }

    /* =====================================================
       SETTINGS
    ===================================================== */
    .settings-content {
      gap: 20px !important;
    }

    .settings-section {}

    .settings-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .setting-row:last-of-type { border-bottom: none; }

    .setting-hint {
      padding: 8px 16px 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--dim);
    }

    /* Toggle */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border2);
      border-radius: 24px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background: var(--white);
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--red); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    .time-input {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--white);
      font-size: 14px;
    }

    .install-text {
      padding: 14px 16px 8px;
      font-size: 13px;
      color: var(--dim);
      line-height: 1.5;
    }

    .install-steps {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .install-platform {
      font-size: 12px;
      color: var(--dim);
    }

    .install-platform strong { color: var(--white); }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span:last-child { color: var(--dim); font-family: var(--font-mono); font-size: 12px; }

    .switch-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: 12px;
      font-family: var(--font-head);
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--dim);
      transition: color 0.15s, border-color 0.15s;
    }

    .switch-btn:active {
      color: var(--white);
      border-color: var(--red);
    }
    /* =====================================================
       ROUTINE SECTIONS (WARM UP / COOL DOWN)
    ===================================================== */
    .routine-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .routine-section.routine-done {
      border-color: rgba(39,174,96,0.4);
      background: rgba(39,174,96,0.03);
    }

    .routine-section.routine-locked {
      opacity: 0.5;
    }

    .routine-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .routine-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--white);
    }

    .routine-icon { display: flex; align-items: center; color: var(--red); }

    .routine-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
    }

    .routine-log-btn {
      background: var(--green);
      color: var(--white);
      font-family: var(--font-head);
      font-size: 14px;
      letter-spacing: 1px;
      padding: 7px 16px;
      border-radius: 8px;
      transition: opacity 0.15s, transform 0.1s;

    .routine-log-btn:active { opacity: 0.8; transform: scale(0.96); }

    .routine-tick {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(39,174,96,0.15);
      color: var(--green);
      border-radius: 50%;
    }

    .routine-locked-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .routine-items {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .routine-item {}

    .routine-item-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }

    .routine-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
    }

    .routine-item-duration {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--red);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .routine-item-desc {
      font-size: 12px;
      color: var(--dim);
      line-height: 1.5;
    }

    /* =====================================================
       FORM GUIDE
    ===================================================== */
    .ex-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .form-guide {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 10px;
    }

    .form-guide-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 100%;
    }

    .form-guide-toggle:active { color: var(--white); }

    .fg-chevron {
      margin-left: auto;
      display: flex;
      transition: transform 0.2s;
      color: var(--dim);
    }

    .form-guide-body {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fg-section-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .fg-cues {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fg-cue {
      font-size: 12px;
      color: var(--white);
      line-height: 1.4;
      padding-left: 10px;
      border-left: 2px solid var(--red);
    }

    .fg-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fg-step {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--dim);
      line-height: 1.4;
    }

    .fg-step-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--red);
      flex-shrink: 0;
      width: 14px;
      padding-top: 1px;
    }

    /* =====================================================
       GATE NOTICES
    ===================================================== */
    .gate-notice {
      background: rgba(192,57,43,0.06);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-align: center;
      text-transform: uppercase;
    }

  </style>
